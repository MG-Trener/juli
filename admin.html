<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Кабинет преподавателя — JULI</title><style>:root{--bg:#0a0f16;--panel:#141c27;--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.23);--ok:#9ad3a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0%,rgba(210,164,105,.12),transparent 26%),linear-gradient(180deg,#0a0f16,#0d131c)}.wrap{width:min(1240px,calc(100% - 28px));margin:auto;padding:28px 0 72px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font:500 30px Georgia,serif;letter-spacing:.09em}.brand span{color:var(--gold2);font:800 10px Inter,sans-serif;letter-spacing:.13em;margin-left:8px}.teacher{margin-left:10px;font-size:10px;color:#8e96a1;letter-spacing:.12em}.btn,button{border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:rgba(17,23,33,.75);color:#fff;font-weight:800;cursor:pointer}.hero{padding:34px 0 20px}.eyebrow{color:var(--gold);font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}h1{font:500 clamp(38px,5vw,58px)/1 Georgia,serif;margin:0 0 12px;letter-spacing:-.03em}.muted{color:var(--muted)}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:#d8dde5;font-size:13px}.status{margin:18px 0;color:var(--muted);font-size:13px}.students{display:grid;gap:18px}.student{border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(24,32,43,.96),rgba(15,21,30,.96));overflow:hidden}.student-head{display:flex;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid rgba(255,255,255,.065)}.name{font:500 27px Georgia,serif}.email{color:var(--muted);font-size:13px;margin-top:4px}.courses{display:grid}.course{display:grid;grid-template-columns:minmax(230px,1.2fr) 120px 120px minmax(170px,.8fr) auto;gap:14px;align-items:center;padding:15px 20px;border-bottom:1px solid rgba(255,255,255,.055)}.course:last-child{border-bottom:0}.course-title strong{display:block;font-size:14px}.course-title span{color:var(--gold);font-size:11px;letter-spacing:.08em}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#d9dde4}.check input{width:18px;height:18px;accent-color:#c6975a}.note{width:100%;padding:10px 11px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:#101721;color:#fff;font:inherit}.save{border:0;background:linear-gradient(135deg,#e2ba82,#b98343);color:#101722;white-space:nowrap}.saved{color:var(--ok);font-size:12px}.empty{padding:28px;color:var(--muted)}@media(max-width:850px){.course{grid-template-columns:1fr 1fr}.course-title,.note{grid-column:1/-1}.save{width:100%}.top,.student-head{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.course{grid-template-columns:1fr}.course-title,.note{grid-column:auto}.wrap{width:min(100% - 20px,1240px)}.student-head{padding:19px}.course{padding:15px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULI <span>HAIR EDUCATION</span><span class="teacher">ПРЕПОДАВАТЕЛЬ</span></div><div><a class="btn" href="./">На сайт</a> <button id="out">Выйти</button></div></div><section class="hero"><div class="eyebrow">Кабинет преподавателя</div><h1>Ученики, доступы и оплата</h1><div class="muted">Для каждой ступени можно независимо разрешить доступ и зафиксировать оплату.</div><div class="summary"><div class="pill" id="studentCount">Ученики: —</div><div class="pill" id="accessCount">Открытых курсов: —</div><div class="pill" id="paidCount">Оплачено: —</div></div></section><div id="status" class="status">Загрузка...</div><section id="students" class="students"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const courseNames=['','Парикмахер с нуля','Женские стрижки','Колористика','Блонд без ошибок','Современные окрашивания','Продвинутый мастер','Колорист-эксперт'];const configured=window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_')&&window.JULI_SUPABASE_ANON_KEY&&!window.JULI_SUPABASE_ANON_KEY.startsWith('YOUR_');const db=configured?window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY):null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function init(){if(!db){status.textContent='Supabase пока не настроен. Заполните supabase-config.js.';students.innerHTML='<div class="empty">Сначала подключите проект Supabase.</div>';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:me,error:meErr}=await db.from('profiles').select('role,email').eq('id',user.id).single();if(meErr||me?.role!=='owner'){location.href='student.html';return}const [{data:profiles,error:pErr},{data:access,error:aErr}]=await Promise.all([db.from('profiles').select('id,full_name,email,role,created_at').order('created_at',{ascending:false}),db.from('course_access').select('*')]);if(pErr||aErr){status.textContent=(pErr||aErr).message;return}const list=(profiles||[]).filter(x=>x.role!=='owner');const map=new Map((access||[]).map(x=>[x.student_id+'-'+x.course_level,x]));studentCount.textContent='Ученики: '+list.length;accessCount.textContent='Открытых курсов: '+(access||[]).filter(x=>x.access_granted).length;paidCount.textContent='Оплачено: '+(access||[]).filter(x=>x.paid).length;status.textContent=list.length?'Изменения сохраняются отдельно по каждой ступени.':'Пока нет зарегистрированных учеников.';students.innerHTML=list.map(s=>`<article class="student"><div class="student-head"><div><div class="name">${esc(s.full_name)||'Без имени'}</div><div class="email">${esc(s.email)}</div></div><div class="muted">Регистрация: ${s.created_at?new Date(s.created_at).toLocaleDateString('ru-RU'):'—'}</div></div><div class="courses">${[1,2,3,4,5,6,7].map(level=>{const a=map.get(s.id+'-'+level)||{};return `<div class="course"><div class="course-title"><span>СТУПЕНЬ ${level}</span><strong>${courseNames[level]}</strong></div><label class="check"><input id="access-${s.id}-${level}" type="checkbox" ${a.access_granted?'checked':''}> Доступ</label><label class="check"><input id="paid-${s.id}-${level}" type="checkbox" ${a.paid?'checked':''}> Оплачено</label><input class="note" id="note-${s.id}-${level}" value="${esc(a.payment_note||'')}" placeholder="Комментарий по оплате"><button class="save" onclick="saveCourse('${s.id}',${level},this)">Сохранить</button></div>`}).join('')}</div></article>`).join('')||'<div class="empty">Пока нет зарегистрированных учеников.</div>'}async function saveCourse(studentId,level,btn){btn.disabled=true;const granted=document.getElementById(`access-${studentId}-${level}`).checked;const paid=document.getElementById(`paid-${studentId}-${level}`).checked;const note=document.getElementById(`note-${studentId}-${level}`).value.trim();const payload={student_id:studentId,course_level:level,access_granted:granted,paid,paid_at:paid?new Date().toISOString():null,payment_note:note||null,updated_at:new Date().toISOString()};const {error}=await db.from('course_access').upsert(payload,{onConflict:'student_id,course_level'});btn.disabled=false;if(error){status.textContent='Ошибка: '+error.message;return}status.textContent=`Сохранено: ${courseNames[level]}`;btn.textContent='Сохранено';setTimeout(()=>btn.textContent='Сохранить',900);setTimeout(init,1100)}init();out.onclick=async()=>{if(db)await db.auth.signOut();location.href='login.html'};</script></body></html>
