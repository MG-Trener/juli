<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Управление учениками — JULI Hair Education</title><style>:root{--bg:#0a0f16;--panel:#141c27;--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.23)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0%,rgba(210,164,105,.12),transparent 26%),linear-gradient(180deg,#0a0f16,#0d131c)}.wrap{width:min(1160px,calc(100% - 28px));margin:auto;padding:30px 0 72px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font:500 28px Georgia,serif;letter-spacing:.09em}.brand span{color:var(--gold2);font:800 10px Inter,sans-serif;letter-spacing:.13em;margin-left:8px}.owner{margin-left:10px;font-size:10px;color:#848d99;letter-spacing:.12em}button{border:1px solid var(--line);border-radius:999px;padding:12px 17px;background:rgba(17,23,33,.7);color:#fff;font-weight:800;cursor:pointer}.panel{margin-top:28px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(24,32,43,.96),rgba(15,21,30,.96));overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.2)}.head{padding:34px;border-bottom:1px solid rgba(255,255,255,.07)}.eyebrow{color:var(--gold);font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}h1{font:500 clamp(38px,5vw,58px)/1 Georgia,serif;margin:0 0 12px;letter-spacing:-.03em}.muted{color:var(--muted)}.rows{display:grid}.row{display:grid;grid-template-columns:1.15fr 1.45fr .8fr auto;gap:14px;align-items:center;padding:19px 24px;border-bottom:1px solid rgba(255,255,255,.06)}.row:last-child{border-bottom:0}.name{font-weight:800}.email{color:var(--muted);font-size:13px;margin-top:3px}select{padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#111821;color:#f7f3ec;font:inherit;outline:none}.save{border:0;background:linear-gradient(135deg,#e2ba82,#b98343);color:#101722}.status{padding:15px 28px;color:var(--muted);font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}@media(max-width:780px){.row{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.head{padding:28px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULI <span>HAIR EDUCATION</span><span class="owner">ВЛАДЕЛЕЦ</span></div><button id="out">Выйти</button></div><section class="panel"><div class="head"><div class="eyebrow">Управление доступом</div><h1>Ученики и ступени</h1><div class="muted">Назначьте каждому зарегистрированному пользователю его ступень обучения.</div></div><div id="status" class="status">Загрузка...</div><div id="rows" class="rows"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=window.supabase?.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY);const names=['Не назначен','1 · Парикмахер с нуля','2 · Женские стрижки','3 · Колористика','4 · Блонд без ошибок','5 · Коммерческие окрашивания','6 · Продвинутый мастер','7 · Колорист-эксперт'];async function init(){if(!db){status.textContent='Supabase пока не настроен.';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:me}=await db.from('profiles').select('role').eq('id',user.id).single();if(me?.role!=='owner'){location.href='student.html';return}const {data:list,error}=await db.from('profiles').select('id,full_name,email,role,course_level').order('created_at',{ascending:false});if(error){status.textContent=error.message;return}status.textContent='Пользователей: '+list.length;rows.innerHTML=list.filter(x=>x.role!=='owner').map(x=>`<div class="row"><div><div class="name">${x.full_name||'Без имени'}</div><div class="email">${x.email||''}</div></div><select id="s-${x.id}">${names.map((n,i)=>`<option value="${i}" ${Number(x.course_level||0)===i?'selected':''}>${n}</option>`).join('')}</select><div class="muted">${x.course_level?'Доступ активен':'Ожидает назначения'}</div><button class="save" onclick="save('${x.id}')">Сохранить</button></div>`).join('')}async function save(id){const v=Number(document.getElementById('s-'+id).value)||null;const {error}=await db.from('profiles').update({course_level:v}).eq('id',id);status.textContent=error?error.message:'Доступ обновлён';if(!error)setTimeout(init,450)}init();out.onclick=async()=>{await db.auth.signOut();location.href='login.html'};</script></body></html>
