<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление учениками — Julia Hair Education</title><style>:root{--ink:#152037;--gold:#b7894c;--muted:#6b7280;--line:#e7ddd0;--bg:#f8f4ee}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(rgba(248,244,238,.86),rgba(248,244,238,.95)),url('assets/site-bg.webp') center/cover fixed}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:34px 0 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-weight:900}.brand span{color:var(--gold)}button{border:0;border-radius:999px;padding:12px 17px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.panel{margin-top:28px;background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 55px rgba(21,32,55,.08);overflow:hidden}.head{padding:28px;border-bottom:1px solid var(--line)}h1{font:500 clamp(36px,5vw,56px)/1 Georgia,serif;margin:0 0 10px}.muted{color:var(--muted)}.rows{display:grid}.row{display:grid;grid-template-columns:1.3fr 1.4fr .8fr auto;gap:14px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:800}.email{color:var(--muted);font-size:14px}select{padding:11px 12px;border:1px solid #ddd3c6;border-radius:12px;background:#fff;font:inherit}.save{background:#b7894c}.status{padding:14px 28px;color:var(--muted);font-size:14px}@media(max-width:760px){.row{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULIA <span>HAIR EDUCATION</span> · ВЛАДЕЛЕЦ</div><button id="out">Выйти</button></div><section class="panel"><div class="head"><h1>Ученики и доступ</h1><div class="muted">Назначьте каждому зарегистрированному пользователю его ступень обучения.</div></div><div id="status" class="status">Загрузка...</div><div id="rows" class="rows"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=window.supabase?.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY);const names=['Не назначен','1 · Парикмахер с нуля','2 · Женские стрижки','3 · Колористика','4 · Блонд без ошибок','5 · Коммерческие окрашивания','6 · Продвинутый мастер','7 · Колорист-эксперт'];async function init(){if(!db){status.textContent='Supabase пока не настроен.';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:me}=await db.from('profiles').select('role').eq('id',user.id).single();if(me?.role!=='owner'){location.href='student.html';return}const {data:list,error}=await db.from('profiles').select('id,full_name,email,role,course_level').order('created_at',{ascending:false});if(error){status.textContent=error.message;return}status.textContent='Пользователей: '+list.length;rows.innerHTML=list.filter(x=>x.role!=='owner').map(x=>`<div class="row"><div><div class="name">${x.full_name||'Без имени'}</div><div class="email">${x.email||''}</div></div><select id="s-${x.id}">${names.map((n,i)=>`<option value="${i}" ${Number(x.course_level||0)===i?'selected':''}>${n}</option>`).join('')}</select><div class="muted">${x.course_level?'Доступ активен':'Ожидает назначения'}</div><button class="save" onclick="save('${x.id}')">Сохранить</button></div>`).join('')}async function save(id){const v=Number(document.getElementById('s-'+id).value)||null;const {error}=await db.from('profiles').update({course_level:v}).eq('id',id);status.textContent=error?error.message:'Доступ обновлён';if(!error)setTimeout(init,450)}init();out.onclick=async()=>{await db.auth.signOut();location.href='login.html'};</script></body></html>
