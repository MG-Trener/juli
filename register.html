<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — Julia Hair Education</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:linear-gradient(rgba(10,14,20,.55),rgba(10,14,20,.72)),url('assets/site-bg.svg') center/cover fixed;color:#152037}.box{width:min(460px,calc(100% - 28px));padding:34px;border:1px solid rgba(215,180,128,.28);border-radius:30px;background:rgba(255,253,249,.94);backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.28)}h1{font-family:Georgia,serif;font-weight:500;font-size:42px;margin:0 0 10px}.muted{color:#6b7280;margin-bottom:24px}.field{display:grid;gap:7px;margin:14px 0}label{font-size:13px;font-weight:700}input{padding:14px 15px;border:1px solid #ddd3c6;border-radius:14px;font:inherit;background:#fff}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:#152037;color:white;font-weight:800;font:inherit;cursor:pointer;margin-top:8px}.link{display:block;text-align:center;margin-top:16px;color:#7b6548;text-decoration:none}.status{margin-top:14px;font-size:14px;min-height:22px}</style></head><body><main class="box"><div style="font-size:12px;font-weight:800;letter-spacing:.1em;color:#b7894c">JULIA HAIR EDUCATION</div><h1>Регистрация</h1><div class="muted">Создайте аккаунт. Доступ к нужной ступени будет назначен владельцем сайта после подтверждения обучения.</div><form id="f"><div class="field"><label>Имя и фамилия</label><input id="name" required autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn">Создать аккаунт</button></form><div id="status" class="status"></div><a class="link" href="login.html">Уже есть аккаунт? Войти</a><a class="link" href="./">← Вернуться на сайт</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const s=document.getElementById('status');const configured=window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_');const db=configured?window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY):null;f.addEventListener('submit',async e=>{e.preventDefault();if(!db){s.textContent='Supabase пока не настроен.';return}s.textContent='Создаём аккаунт...';const {error}=await db.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}});s.textContent=error?error.message:'Аккаунт создан. Проверьте email, если подтверждение включено, затем войдите.';});</script></body></html>
