<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Регистрация — JULI</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:linear-gradient(rgba(10,14,20,.55),rgba(10,14,20,.72)),url('assets/site-bg.svg') center/cover fixed;color:#152037}.box{width:min(460px,calc(100% - 28px));padding:34px;border:1px solid rgba(215,180,128,.28);border-radius:30px;background:rgba(255,253,249,.94);backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.28)}h1{font-family:Georgia,serif;font-weight:500;font-size:42px;margin:0 0 10px}.muted{color:#6b7280;margin-bottom:24px}.field{display:grid;gap:7px;margin:14px 0}label{font-size:13px;font-weight:700}input{padding:14px 15px;border:1px solid #ddd3c6;border-radius:14px;font:inherit;background:#fff}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:#152037;color:white;font-weight:800;font:inherit;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.55;cursor:wait}.link{display:block;text-align:center;margin-top:16px;color:#7b6548;text-decoration:none}.status{margin-top:16px;font-size:14px;min-height:22px;line-height:1.45}.status.ok{padding:14px;border-radius:14px;background:#edf7ef;color:#276137;border:1px solid #c8e6ce}.status.err{color:#9b2c2c}</style></head><body><main class="box"><div style="font-size:12px;font-weight:800;letter-spacing:.1em;color:#b7894c">JULI HAIR EDUCATION</div><h1>Регистрация</h1><div class="muted">Создайте аккаунт. После регистрации подтвердите адрес электронной почты. Доступ к курсам назначит преподаватель.</div><form id="f"><div class="field"><label>Имя и фамилия</label><input id="name" required autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" id="submitBtn" type="submit">Создать аккаунт</button></form><div id="status" class="status"></div><a class="link" href="login.html">Уже есть аккаунт? Войти</a><a class="link" href="./">← Вернуться на сайт</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(function(){const form=document.getElementById('f');const nameInput=document.getElementById('name');const emailInput=document.getElementById('email');const passwordInput=document.getElementById('password');const statusEl=document.getElementById('status');const submitBtn=document.getElementById('submitBtn');const configured=!!(window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_')&&window.JULI_SUPABASE_ANON_KEY&&!window.JULI_SUPABASE_ANON_KEY.startsWith('YOUR_'));let db=null;try{if(configured&&window.supabase)db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY)}catch(err){console.error(err)}form.addEventListener('submit',async function(e){e.preventDefault();statusEl.className='status';if(!db){statusEl.className='status err';statusEl.textContent='Авторизация временно недоступна. Обновите страницу.';return}submitBtn.disabled=true;statusEl.textContent='Создаём аккаунт и отправляем письмо...';try{const redirect='https://mg-trener.github.io/juli/login.html?confirmed=1';const {data,error}=await db.auth.signUp({email:emailInput.value.trim().toLowerCase(),password:passwordInput.value,options:{emailRedirectTo:redirect,data:{full_name:nameInput.value.trim()}}});if(error){statusEl.className='status err';statusEl.textContent='Ошибка регистрации: '+error.message;return}statusEl.className='status ok';statusEl.innerHTML='<strong>Проверьте почту.</strong><br>Мы отправили письмо со ссылкой подтверждения на '+emailInput.value.trim()+'. Перейдите по ссылке в письме, и после подтверждения сможете войти.';form.reset();submitBtn.textContent='Письмо отправлено';}catch(err){console.error(err);statusEl.className='status err';statusEl.textContent='Ошибка регистрации: '+(err&&err.message?err.message:'неизвестная ошибка')}finally{submitBtn.disabled=false}})})();</script></body></html>
