<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Мои курсы — JULI</title><style>:root{--bg:#0a0f16;--panel:#141c27;--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.23)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0%,rgba(210,164,105,.12),transparent 26%),linear-gradient(180deg,#0a0f16,#0d131c)}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:30px 0 72px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font:500 28px Georgia,serif;letter-spacing:.09em}.brand span{color:var(--gold2);font:800 10px Inter,sans-serif;letter-spacing:.13em;margin-left:8px}.btn,button{border:1px solid var(--line);border-radius:999px;padding:12px 18px;background:rgba(17,23,33,.7);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.hero{position:relative;overflow:hidden;margin-top:28px;padding:38px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(25,33,44,.95),rgba(15,21,30,.95));box-shadow:0 24px 70px rgba(0,0,0,.2)}.hero:after{content:"JULI";position:absolute;right:25px;top:-28px;font:500 132px Georgia,serif;color:rgba(226,188,137,.045);letter-spacing:.07em}.eyebrow{position:relative;z-index:2;color:var(--gold);font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{position:relative;z-index:2;font:500 clamp(40px,6vw,64px)/1 Georgia,serif;margin:10px 0 14px;letter-spacing:-.03em}.muted{position:relative;z-index:2;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{display:flex;flex-direction:column;padding:24px;border-radius:22px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(160deg,rgba(27,35,46,.94),rgba(17,23,32,.94));min-height:210px}.card h3{font:500 28px/1.08 Georgia,serif;margin:10px 0 9px}.card .muted{font-size:14px}.card .eyebrow{font-size:10px}.card .actions{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.state{font-size:12px;color:#9ad3a8}.open{border:0;background:linear-gradient(135deg,#e2ba82,#b98343);color:#101722}.empty{margin-top:18px;padding:26px;border:1px solid var(--line);border-radius:22px;color:var(--muted);background:rgba(255,255,255,.02)}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hero{padding:28px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULI <span>HAIR EDUCATION</span></div><div><a class="btn" href="./">На сайт</a> <button id="out">Выйти</button></div></div><section class="hero"><div class="eyebrow">Личный кабинет ученика</div><h1 id="title">Мои курсы</h1><p id="desc" class="muted">Проверяем доступные ступени обучения.</p></section><div id="courses" class="grid"></div><div id="empty" class="empty" hidden>Преподаватель пока не открыл вам ни одной ступени. После назначения доступа курс появится здесь автоматически.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js"></script><script>const catalog={1:{title:'Парикмахер с нуля',desc:'Инструменты, постановка руки, зоны, геометрия и основы стрижки.'},2:{title:'Женские стрижки',desc:'Каре, боб, каскад, слои, формы и персонализация.'},3:{title:'Колористика',desc:'Цветовой круг, УГТ, фон осветления, красители и тонирование.'},4:{title:'Блонд без ошибок',desc:'Осветление, диагностика, чистые оттенки и качество волос.'},5:{title:'Современные окрашивания',desc:'AirTouch, балаяж, растяжка, контуринг и рельеф.'},6:{title:'Продвинутый мастер',desc:'Сложные базы, исправления, диагностика и стратегия.'},7:{title:'Колорист-эксперт',desc:'Сложные коррекции, прогноз результата и работа высокого чека.'}};const configured=window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_')&&window.JULI_SUPABASE_ANON_KEY&&!window.JULI_SUPABASE_ANON_KEY.startsWith('YOUR_');const db=configured?window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY):null;async function init(){if(!db){title.textContent='Система авторизации не настроена';desc.textContent='Необходимо подключить Supabase.';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:p,error:pErr}=await db.from('profiles').select('*').eq('id',user.id).single();if(pErr||!p){console.error('Student profile error:',pErr);desc.textContent='Не удалось загрузить профиль. Обратитесь к преподавателю.';return}if(p.role==='owner'){location.href='admin.html';return}const hasStatusFields=Object.prototype.hasOwnProperty.call(p,'is_active')&&Object.prototype.hasOwnProperty.call(p,'archived');if(hasStatusFields&&(!p.is_active||p.archived)){await db.auth.signOut();location.href='login.html?blocked=1';return}const {data:access,error}=await db.from('course_access').select('course_level,access_granted,paid').eq('student_id',user.id).eq('access_granted',true).order('course_level');if(error){console.error('Course access error:',error);desc.textContent='Не удалось загрузить список курсов. Попробуйте обновить страницу.';return}title.textContent=p.full_name?`${p.full_name}, ваши курсы`:'Мои курсы';desc.textContent='Здесь отображаются только ступени, которые открыл преподаватель.';const list=access||[];empty.hidden=list.length>0;courses.innerHTML=list.map(a=>{const c=catalog[a.course_level];return `<article class="card"><div class="eyebrow">Ступень ${a.course_level}</div><h3>${c.title}</h3><div class="muted">${c.desc}</div><div class="actions"><span class="state">${a.paid?'Оплата отмечена':'Доступ разрешён'}</span><a class="btn open" href="course-${a.course_level}.html">Открыть курс</a></div></article>`}).join('')}init();out.onclick=async()=>{if(db)await db.auth.signOut();location.href='login.html'};</script></body></html>
