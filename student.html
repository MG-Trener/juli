<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой курс — JULI Hair Education</title><style>:root{--bg:#0a0f16;--panel:#141c27;--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.23)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0%,rgba(210,164,105,.12),transparent 26%),linear-gradient(180deg,#0a0f16,#0d131c)}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:30px 0 72px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font:500 28px Georgia,serif;letter-spacing:.09em}.brand span{color:var(--gold2);font:800 10px Inter,sans-serif;letter-spacing:.13em;margin-left:8px}.btn,button{border:1px solid var(--line);border-radius:999px;padding:12px 18px;background:rgba(17,23,33,.7);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.hero{position:relative;overflow:hidden;margin-top:28px;padding:38px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(25,33,44,.95),rgba(15,21,30,.95));box-shadow:0 24px 70px rgba(0,0,0,.2)}.hero:after{content:"JULI";position:absolute;right:25px;top:-28px;font:500 132px Georgia,serif;color:rgba(226,188,137,.045);letter-spacing:.07em}.eyebrow{position:relative;z-index:2;color:var(--gold);font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{position:relative;z-index:2;font:500 clamp(40px,6vw,64px)/1 Georgia,serif;margin:10px 0 14px;letter-spacing:-.03em}.muted{position:relative;z-index:2;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{padding:24px;border-radius:22px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(160deg,rgba(27,35,46,.94),rgba(17,23,32,.94));min-height:150px}.card h3{font:500 25px/1.08 Georgia,serif;margin:10px 0 9px}.card .muted{font-size:13px}.card .eyebrow{font-size:10px}.card:hover{border-color:var(--line)}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hero{padding:28px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULI <span>HAIR EDUCATION</span></div><button id="out">Выйти</button></div><section class="hero"><div class="eyebrow">Личный кабинет ученика</div><h1 id="title">Загрузка курса...</h1><p id="desc" class="muted">Проверяем назначенную ступень обучения.</p></section><div id="modules" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const courses={1:{title:'Ступень 1 · Парикмахер с нуля',desc:'База профессии: инструмент, постановка руки, зоны, геометрия и основы стрижки.',modules:['Инструменты и рабочее место','Постановка руки','Разделение головы на зоны','Базовая геометрия стрижки','Сушка и брашинг','Практическая отработка']},2:{title:'Ступень 2 · Женские стрижки',desc:'Коммерческие формы и персонализация.',modules:['Линия и градуировка','Слои','Каре и боб','Каскад','Чёлки','Персонализация формы']},3:{title:'Ступень 3 · Колористика',desc:'Фундамент цвета и коммерческого окрашивания.',modules:['Цветовой круг','Уровни глубины тона','Фон осветления','Нейтрализация','Оксиды и красители','Седина и тонирование']},4:{title:'Ступень 4 · Блонд без ошибок',desc:'Безопасное осветление и чистые оттенки.',modules:['Диагностика','Осветление','Работа с фоном','Прикорневая зона','Тонирование','Сохранение качества волос']},5:{title:'Ступень 5 · Коммерческие окрашивания',desc:'Современные техники под реального клиента.',modules:['AirTouch','Балаяж','Растяжка цвета','Контуринг','Рельефное окрашивание','Комбинирование техник']},6:{title:'Ступень 6 · Продвинутый мастер',desc:'Сложные базы, коррекция и самостоятельные решения.',modules:['История окрашиваний','Пятна и полосы','Провалившийся цвет','Диагностика рисков','Стратегия работы','Консультация клиента']},7:{title:'Ступень 7 · Колорист-эксперт',desc:'Коррекция сложных случаев и работа высокого чека.',modules:['Сложная коррекция','Прогноз результата','Построение стратегии','Расчёт формул','Коммуникация','Экспертный кейс']}};const configured=window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_');const db=configured?window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY):null;async function init(){if(!db){title.textContent='Система авторизации не настроена';desc.textContent='Необходимо подключить Supabase.';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:p,error}=await db.from('profiles').select('full_name,role,course_level').eq('id',user.id).single();if(error||!p){title.textContent='Доступ не назначен';desc.textContent='Свяжитесь с преподавателем.';return}if(p.role==='owner'){location.href='admin.html';return}const c=courses[p.course_level];if(!c){title.textContent='Курс пока не назначен';desc.textContent='После подтверждения оплаты владелец сайта назначит вам нужную ступень.';return}title.textContent=c.title;desc.textContent=(p.full_name?p.full_name+', ':'')+c.desc;modules.innerHTML=c.modules.map((m,i)=>`<article class="card"><div class="eyebrow">Модуль ${i+1}</div><h3>${m}</h3><div class="muted">Материалы этого модуля будут размещены здесь.</div></article>`).join('')}init();out.onclick=async()=>{if(db)await db.auth.signOut();location.href='login.html'};</script></body></html>
