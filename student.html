<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой курс — Julia Hair Education</title><style>:root{--ink:#152037;--gold:#b7894c;--muted:#6b7280;--line:#e7ddd0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(rgba(10,14,20,.58),rgba(10,14,20,.72)),url('assets/site-bg.svg') center/cover fixed}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:34px 0 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;color:white}.brand{font-weight:900}.brand span{color:#d7af78}button,a.btn{border:0;border-radius:999px;padding:12px 17px;background:#152037;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.hero,.card{background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 55px rgba(0,0,0,.18)}.hero{padding:34px;margin-top:30px}.eyebrow{color:var(--gold);font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase}h1{font:500 clamp(38px,6vw,62px)/1 Georgia,serif;margin:10px 0 14px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}.card{padding:24px}.card h3{margin:0 0 8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULIA <span>HAIR EDUCATION</span></div><button id="out">Выйти</button></div><section class="hero"><div class="eyebrow">Личный кабинет ученика</div><h1 id="title">Загрузка курса...</h1><p id="desc" class="muted">Проверяем назначенную ступень обучения.</p></section><div id="modules" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const courses={1:{title:'Ступень 1 · Парикмахер с нуля',desc:'База профессии: инструмент, постановка руки, зоны, геометрия и основы стрижки.',modules:['Инструменты и рабочее место','Постановка руки','Разделение головы на зоны','Базовая геометрия стрижки','Сушка и брашинг','Практическая отработка']},2:{title:'Ступень 2 · Женские стрижки',desc:'Коммерческие формы и персонализация.',modules:['Линия и градуировка','Слои','Каре и боб','Каскад','Чёлки','Персонализация формы']},3:{title:'Ступень 3 · Колористика',desc:'Фундамент цвета и коммерческого окрашивания.',modules:['Цветовой круг','Уровни глубины тона','Фон осветления','Нейтрализация','Оксиды и красители','Седина и тонирование']},4:{title:'Ступень 4 · Блонд без ошибок',desc:'Безопасное осветление и чистые оттенки.',modules:['Диагностика','Осветление','Работа с фоном','Прикорневая зона','Тонирование','Сохранение качества волос']},5:{title:'Ступень 5 · Коммерческие окрашивания',desc:'Современные техники под реального клиента.',modules:['AirTouch','Балаяж','Растяжка цвета','Контуринг','Рельефное окрашивание','Комбинирование техник']},6:{title:'Ступень 6 · Продвинутый мастер',desc:'Сложные базы, коррекция и самостоятельные решения.',modules:['История окрашиваний','Пятна и полосы','Провалившийся цвет','Диагностика рисков','Стратегия работы','Консультация клиента']},7:{title:'Ступень 7 · Колорист-эксперт',desc:'Коррекция сложных случаев и работа высокого чека.',modules:['Сложная коррекция','Прогноз результата','Построение стратегии','Расчёт формул','Коммуникация','Экспертный кейс']}};const configured=window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_');const db=configured?window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY):null;async function init(){if(!db){title.textContent='Система авторизации не настроена';desc.textContent='Необходимо подключить Supabase.';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:p,error}=await db.from('profiles').select('full_name,role,course_level').eq('id',user.id).single();if(error||!p){title.textContent='Доступ не назначен';desc.textContent='Свяжитесь с преподавателем.';return}if(p.role==='owner'){location.href='admin.html';return}const c=courses[p.course_level];if(!c){title.textContent='Курс пока не назначен';desc.textContent='После подтверждения оплаты владелец сайта назначит вам нужную ступень.';return}title.textContent=c.title;desc.textContent=(p.full_name?p.full_name+', ':'')+c.desc;modules.innerHTML=c.modules.map((m,i)=>`<article class="card"><div class="eyebrow">Модуль ${i+1}</div><h3>${m}</h3><div class="muted">Материалы этого модуля будут размещены здесь.</div></article>`).join('')}init();out.onclick=async()=>{if(db)await db.auth.signOut();location.href='login.html'};</script></body></html>
