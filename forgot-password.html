<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Восстановление пароля — JULI</title><style>:root{--gold:#d5aa73;--gold2:#f0cf9e;--text:#f7f3ed;--muted:#aeb4be;--line:rgba(219,177,119,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0%,rgba(210,165,108,.1),transparent 28%),#0a0f16}.box{width:min(440px,100%);padding:34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#1c232d,#11171f)}.brand{font:500 34px Georgia,serif;color:#fff}.brand small{display:block;font:700 9px Inter,sans-serif;letter-spacing:.14em;color:#d6bea0}h1{font:500 38px/1 Georgia,serif;margin:28px 0 10px}.muted{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:22px 0 12px}label{font-size:12px;color:#d4d7db}input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.11);border-radius:10px;background:#111720;color:#fff;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:9px;background:linear-gradient(135deg,#e5bd84,#a87741);color:#12171e;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.status{margin-top:16px;min-height:22px;font-size:13px;line-height:1.45;color:#d7b784}.status.ok{color:#bde4c5}.status.err{color:#efb1b1}.links{text-align:center;margin-top:22px}.links a{display:block;margin-top:10px;color:#d9c4a6;text-decoration:none}</style></head><body><main class="box"><div class="brand">JULI<small>HAIR EDUCATION</small></div><h1>Восстановить пароль</h1><p class="muted">Введите email аккаунта. Мы отправим ссылку, по которой можно задать новый пароль.</p><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><button class="btn" id="submitBtn">Отправить ссылку</button></form><div id="status" class="status"></div><div class="links"><a href="login.html">← Вернуться ко входу</a><a href="./">На главную</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js?v=20260826-3"></script><script>(function(){const db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY),f=document.getElementById('f'),email=document.getElementById('email'),btn=document.getElementById('submitBtn'),st=document.getElementById('status');f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;st.className='status';st.textContent='Отправляем письмо...';const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await db.auth.resetPasswordForEmail(email.value.trim().toLowerCase(),{redirectTo});if(error){st.className='status err';st.textContent='Не удалось отправить письмо. Проверьте email и повторите попытку.';btn.disabled=false;return}st.className='status ok';st.textContent='Если аккаунт с таким email существует, письмо для восстановления отправлено. Проверьте входящие и папку «Спам».';btn.textContent='Письмо отправлено';};})();</script></body></html>
