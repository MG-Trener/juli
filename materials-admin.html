<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Материалы курсов — JULI</title><style>:root{--bg:#0a0f16;--panel:#141c27;--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.23);--ok:#9ad3a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 80% 0%,rgba(210,164,105,.12),transparent 26%),linear-gradient(180deg,#0a0f16,#0d131c)}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font:500 29px Georgia,serif;letter-spacing:.09em}.brand span{font:800 10px Inter,sans-serif;color:var(--gold2);letter-spacing:.13em;margin-left:8px}.btn,button{border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:rgba(17,23,33,.75);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.save{border:0;background:linear-gradient(135deg,#e2ba82,#b98343);color:#101722}.hero{padding:34px 0 18px}.eyebrow{color:var(--gold);font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{font:500 clamp(38px,5vw,58px)/1 Georgia,serif;margin:8px 0 12px}.muted{color:var(--muted)}.migration{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:18px 20px;margin:10px 0 18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(210,165,108,.12),rgba(255,255,255,.025))}.migration strong{display:block;color:var(--gold2);margin-bottom:4px}.migration.done{border-color:rgba(154,211,168,.35);background:rgba(67,126,81,.12)}.migration.done strong{color:#bfe4c6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px 13px}.tab.active{background:linear-gradient(135deg,#e2ba82,#b98343);color:#101722;border-color:transparent}.status{min-height:22px;color:var(--muted);font-size:13px;margin:10px 0 16px}.course-head{padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(210,165,108,.07);margin-bottom:14px}.course-head h2{font:500 31px Georgia,serif;margin:4px 0 7px;color:var(--gold2)}.modules{display:grid;gap:12px}.module{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(145deg,rgba(24,32,43,.96),rgba(15,21,30,.96))}.module-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.module-no{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.13em}.field{display:grid;gap:7px;margin-top:10px}.field label{font-size:12px;color:#d7dce3;font-weight:800}.title-input,textarea{width:100%;border:1px solid rgba(255,255,255,.1);background:#0f1620;color:#f5f2eb;border-radius:12px;padding:12px 13px;font:inherit;outline:none}.title-input:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:230px;line-height:1.55;resize:vertical}.publish{display:flex;align-items:center;gap:8px;font-size:13px;color:#d7dce3}.publish input{width:18px;height:18px;accent-color:#c6975a}.bottom{position:sticky;bottom:12px;display:flex;justify-content:flex-end;margin-top:16px}.bottom .save{box-shadow:0 12px 32px rgba(0,0,0,.35)}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.module-head{align-items:flex-start;flex-direction:column}.migration{grid-template-columns:1fr}.migration button,.bottom .save{width:100%}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULI <span>МАТЕРИАЛЫ КУРСОВ</span></div><div><a class="btn" href="admin.html">← Ученики</a> <a class="btn" href="./">На сайт</a> <button id="out">Выйти</button></div></div><section class="hero"><div class="eyebrow">Кабинет преподавателя</div><h1>Редактор учебных материалов</h1><div class="muted">Выберите ступень, отредактируйте заголовки и содержание модулей. После сохранения ученики увидят обновлённую версию автоматически.</div></section><div id="migration" class="migration"><div><strong id="migrationTitle">Проверяем хранение материалов…</strong><span id="migrationText" class="muted">Считаем модули в Supabase.</span></div><button id="migrateAll" class="save" hidden>Перенести 42 модуля в Supabase</button></div><div id="tabs" class="tabs"></div><div id="status" class="status">Проверяем доступ...</div><section id="editor" hidden><div class="course-head"><div class="eyebrow" id="courseLevel"></div><h2 id="courseTitle"></h2><div id="courseSubtitle" class="muted"></div></div><div id="modules" class="modules"></div><div class="bottom"><button id="saveAll" class="save">Сохранить ступень</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js"></script><script src="course-content.js"></script><script>const catalog=window.JULI_COURSE_CONTENT||{};const configured=window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_')&&window.JULI_SUPABASE_ANON_KEY&&!window.JULI_SUPABASE_ANON_KEY.startsWith('YOUR_');const db=configured?window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY):null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let level=1;let rowsByModule=new Map();const expectedCount=Object.values(catalog).reduce((n,c)=>n+(c.modules?.length||0),0);async function init(){if(!db){status.textContent='Supabase не подключён.';return}const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:me,error}=await db.from('profiles').select('role').eq('id',user.id).single();if(error||me?.role!=='owner'){location.href='student.html';return}tabs.innerHTML=Object.keys(catalog).map(n=>`<button class="tab ${Number(n)===level?'active':''}" onclick="openCourse(${n})">${n}. ${esc(catalog[n].title)}</button>`).join('');editor.hidden=false;await checkMigration();await loadCourse()}async function checkMigration(){const {count,error}=await db.from('course_materials').select('id',{count:'exact',head:true});if(error){migrationTitle.textContent='Не удалось проверить Supabase';migrationText.textContent=error.message;return}const total=count||0;if(total>=expectedCount&&expectedCount>0){migration.classList.add('done');migrationTitle.textContent=`Материалы находятся в Supabase: ${total} из ${expectedCount}`;migrationText.textContent='Перенос завершён. Публичный файл с текстами теперь можно удалить из GitHub.';migrateAll.hidden=true}else{migration.classList.remove('done');migrationTitle.textContent=`В Supabase: ${total} из ${expectedCount} модулей`;migrationText.textContent='Нажмите кнопку один раз. Существующие редакции модулей будут сохранены, недостающие — добавлены.';migrateAll.hidden=false}}migrateAll.onclick=async()=>{if(!confirm('Перенести все текущие учебные материалы в Supabase? Существующие сохранённые модули не будут перезаписаны.'))return;migrateAll.disabled=true;let done=0;status.textContent=`Перенос: 0 из ${expectedCount}...`;const {data:existing,error:eErr}=await db.from('course_materials').select('id,course_level,module_no');if(eErr){status.textContent='Ошибка проверки: '+eErr.message;migrateAll.disabled=false;return}const keys=new Set((existing||[]).map(r=>`${r.course_level}-${r.module_no}`));for(const [levelKey,c] of Object.entries(catalog)){for(let i=0;i<c.modules.length;i++){const n=i+1;const key=`${levelKey}-${n}`;if(!keys.has(key)){const def=c.modules[i];const {error}=await db.from('course_materials').insert({course_level:Number(levelKey),module_no:n,title:def.title,content:def.content||'',published:true,sort_order:n,updated_at:new Date().toISOString()});if(error){status.textContent=`Ошибка переноса: ступень ${levelKey}, модуль ${n}: ${error.message}`;migrateAll.disabled=false;return}}done++;status.textContent=`Перенос: ${done} из ${expectedCount}...`}}status.textContent=`Готово. Проверяем ${expectedCount} модулей в Supabase...`;migrateAll.disabled=false;await checkMigration();await loadCourse()};async function openCourse(n){level=Number(n);document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===level-1));await loadCourse()}async function loadCourse(){const c=catalog[level];courseLevel.textContent=`Ступень ${level}`;courseTitle.textContent=c.title;courseSubtitle.textContent=c.subtitle;status.textContent='Загружаем сохранённые материалы...';const {data,error}=await db.from('course_materials').select('id,module_no,title,content,published,sort_order').eq('course_level',level).order('sort_order').order('module_no');if(error){status.textContent='Ошибка загрузки: '+error.message;return}rowsByModule=new Map();(data||[]).forEach(r=>{if(!rowsByModule.has(r.module_no))rowsByModule.set(r.module_no,r)});modules.innerHTML=c.modules.map((def,i)=>{const n=i+1;const row=rowsByModule.get(n);return `<article class="module"><div class="module-head"><div><div class="module-no">МОДУЛЬ ${n}</div></div><label class="publish"><input id="pub-${n}" type="checkbox" ${row?.published===false?'':'checked'}> Опубликован</label></div><div class="field"><label>Название модуля</label><input class="title-input" id="title-${n}" value="${esc(row?.title||def.title)}"></div><div class="field"><label>Содержание</label><textarea id="content-${n}">${esc(row?.content||def.content||'')}</textarea></div></article>`}).join('');status.textContent=(data||[]).length?'Загружена версия из Supabase.':'Показана временная базовая версия. Перенесите материалы в Supabase.'}saveAll.onclick=async()=>{saveAll.disabled=true;status.textContent='Сохраняем материалы...';const c=catalog[level];for(let i=0;i<c.modules.length;i++){const n=i+1;const payload={course_level:level,module_no:n,title:document.getElementById(`title-${n}`).value.trim()||c.modules[i].title,content:document.getElementById(`content-${n}`).value.trim(),published:document.getElementById(`pub-${n}`).checked,sort_order:n,updated_at:new Date().toISOString()};const old=rowsByModule.get(n);let error;if(old){({error}=await db.from('course_materials').update(payload).eq('id',old.id))}else{({error}=await db.from('course_materials').insert(payload))}if(error){status.textContent=`Ошибка в модуле ${n}: ${error.message}`;saveAll.disabled=false;return}}status.textContent='Ступень сохранена в Supabase.';saveAll.textContent='Сохранено';setTimeout(()=>saveAll.textContent='Сохранить ступень',1200);saveAll.disabled=false;await checkMigration();await loadCourse()};out.onclick=async()=>{if(db)await db.auth.signOut();location.href='login.html'};init();</script></body></html>
