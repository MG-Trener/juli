<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Прогресс ученика — JULI</title><style>:root{--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.23);--ok:#9ad3a8;--danger:#efb1b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 82% 0%,rgba(210,164,108,.12),transparent 25%),linear-gradient(180deg,#0a0f16,#0d131c)}a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font:500 28px Georgia,serif}.brand span{color:var(--gold2);font:800 10px Inter,sans-serif;margin-left:8px}.btn,button{border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:#111923;color:#fff;font-weight:800;cursor:pointer}.hero{padding:34px 0 20px}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.14em}h1{font:500 48px/1 Georgia,serif;margin:9px 0 10px}.muted,.status{color:var(--muted)}.status{margin:14px 0;font-size:13px}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}.courses{display:grid;gap:14px}.course{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(145deg,#18202b,#0f151e)}.course-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.course-head strong{font:500 22px Georgia,serif}.course-head span{color:var(--gold);font-size:11px}.mods{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mod{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#101721;font-size:12px}.mod input{width:17px;height:17px;accent-color:#c6975a}.mod.disabled{opacity:.35}.mod.current{border-color:rgba(210,165,108,.38);background:rgba(210,165,108,.08)}.note{margin-top:10px;color:#8e97a3;font-size:11px}.footer{position:sticky;bottom:0;margin-top:18px;padding:14px 0;background:linear-gradient(180deg,rgba(10,15,22,0),#0a0f16 30%);display:flex;justify-content:flex-end}.save{border:0;background:linear-gradient(135deg,#e2ba82,#b98343);color:#101722;min-width:210px}.empty{padding:24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:700px){.mods{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}.save{width:100%}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULI <span>HAIR EDUCATION</span></div><div><a id="back" class="btn" href="teacher.html">← Назад</a> <button id="out">Выйти</button></div></div><section class="hero"><div class="eyebrow">Прогресс обучения</div><h1 id="name">Ученик</h1><div class="muted">Показываются только ступени, которые доступны вам и предварительно открыты ученику Суперучителем.</div></section><div id="status" class="status">Загрузка...</div><section id="courses" class="courses"></section><div class="footer"><button id="save" class="save">Сохранить прогресс</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js?v=20260826-3"></script><script>(function(){'use strict';const names=['','Парикмахер с нуля','Женские стрижки','Колористика','Блонд без ошибок','Современные окрашивания','Продвинутый мастер','Колорист-эксперт'];const qs=new URLSearchParams(location.search),id=qs.get('student'),only=Number(qs.get('level')||0),status=document.getElementById('status'),box=document.getElementById('courses'),nameEl=document.getElementById('name'),save=document.getElementById('save'),back=document.getElementById('back');const db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY);let role='',visible=[];function sync(level){const c=box.querySelector('[data-level="'+level+'"]');if(!c)return;const inputs=[...c.querySelectorAll('input[data-module]')];let prev=true;inputs.forEach((input,i)=>{const lab=input.closest('.mod');input.disabled=!(i===0||prev);lab.classList.toggle('disabled',input.disabled);lab.classList.toggle('current',!input.checked&&!input.disabled&&inputs.slice(0,i).every(x=>x.checked));prev=prev&&input.checked})}async function init(){if(!id){status.textContent='Не выбран ученик.';save.disabled=true;return}const u=await db.auth.getUser();if(!u.data.user){location.href='login.html';return}const me=await db.from('profiles').select('role').eq('id',u.data.user.id).single();role=me.data?.role||'';if(role==='candidate'||role==='student'){location.href=role==='candidate'?'candidate.html':'student.html';return}back.href=role==='superteacher'?'admin.html':'teacher.html';const [student,a,p]=await Promise.all([db.from('profiles').select('full_name,email').eq('id',id).single(),db.from('course_access').select('course_level,access_granted').eq('student_id',id).eq('access_granted',true),db.from('student_progress').select('course_level,module_no,completed').eq('student_id',id)]);if(student.error||a.error||p.error){status.className='status err';status.textContent='Нет доступа к прогрессу этого ученика.';save.disabled=true;return}nameEl.textContent=student.data?.full_name||student.data?.email||'Ученик';visible=(a.data||[]).map(x=>Number(x.course_level)).filter(l=>!only||l===only).sort((x,y)=>x-y);const done=new Set((p.data||[]).filter(x=>x.completed).map(x=>`${x.course_level}-${x.module_no}`));if(!visible.length){box.innerHTML='<div class="empty">Нет ступеней, доступных для управления.</div>';save.disabled=true;status.textContent='Суперучитель должен сначала открыть ступень ученику.';return}box.innerHTML=visible.map(level=>`<article class="course" data-level="${level}"><div class="course-head"><strong>${level}. ${names[level]}</strong><span>Доступ разрешён</span></div><div class="mods">${[1,2,3,4,5,6].map(n=>`<label class="mod"><input type="checkbox" data-module="${n}" ${done.has(level+'-'+n)?'checked':''}> Модуль ${n}</label>`).join('')}</div><div class="note">Модули подтверждаются строго по порядку.</div></article>`).join('');visible.forEach(sync);status.textContent='Готово.'}box.addEventListener('change',e=>{if(!e.target.matches('input[data-module]'))return;const c=e.target.closest('.course'),level=Number(c.dataset.level),n=Number(e.target.dataset.module);if(!e.target.checked)c.querySelectorAll('input[data-module]').forEach(x=>{if(Number(x.dataset.module)>n)x.checked=false});sync(level)});save.onclick=async()=>{save.disabled=true;status.textContent='Сохраняем...';const rows=[],now=new Date().toISOString();visible.forEach(level=>{const c=box.querySelector('[data-level="'+level+'"]');for(let n=1;n<=6;n++){const input=c.querySelector('input[data-module="'+n+'"]');rows.push({student_id:id,course_level:level,module_no:n,completed:!!input.checked,completed_at:input.checked?now:null})}});const r=await db.from('student_progress').upsert(rows,{onConflict:'student_id,course_level,module_no'});if(r.error){status.className='status err';status.textContent='Не удалось сохранить прогресс.';save.disabled=false;return}status.className='status ok';status.textContent='✓ Прогресс сохранён.';save.disabled=false};document.getElementById('out').onclick=async()=>{await db.auth.signOut();location.href='./'};init()})();</script></body></html>
