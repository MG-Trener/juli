<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Прогресс ученика — JULI</title><style>:root{--bg:#0a0f16;--panel:#141c27;--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.23);--ok:#9ad3a8;--danger:#efb1b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 82% 0%,rgba(210,164,105,.12),transparent 25%),linear-gradient(180deg,#0a0f16,#0d131c)}a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font:500 28px Georgia,serif;letter-spacing:.09em}.brand span{color:var(--gold2);font:800 10px Inter,sans-serif;letter-spacing:.13em;margin-left:8px}.btn,button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:rgba(17,23,33,.78);color:#fff;font-weight:800;cursor:pointer}.hero{padding:34px 0 20px}.eyebrow{color:var(--gold);font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{font:500 clamp(36px,5vw,54px)/1 Georgia,serif;margin:9px 0 10px}.muted{color:var(--muted)}.status{margin:14px 0;color:var(--muted);font-size:13px}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}.courses{display:grid;gap:14px;margin-top:18px}.course{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(145deg,rgba(24,32,43,.96),rgba(15,21,30,.96))}.course.locked{opacity:.5}.course-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.course-head strong{font:500 22px Georgia,serif}.course-head span{color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.mods{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mod{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#101721;font-size:12px}.mod input{width:17px;height:17px;accent-color:#c6975a}.mod.disabled{opacity:.35}.mod.current{border-color:rgba(210,165,108,.38);background:rgba(210,165,108,.08)}.note{margin-top:10px;color:#8e97a3;font-size:11px}.footer{position:sticky;bottom:0;margin-top:18px;padding:14px 0;background:linear-gradient(180deg,rgba(10,15,22,0),#0a0f16 30%);display:flex;justify-content:flex-end}.save{border:0;background:linear-gradient(135deg,#e2ba82,#b98343);color:#101722;min-width:210px}@media(max-width:700px){.mods{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}.save{width:100%}}</style></head><body><main class="wrap"><div class="top"><div class="brand">JULI <span>HAIR EDUCATION</span></div><div><a id="backLink" class="btn" href="admin.html">← Назад</a> <button id="out">Выйти</button></div></div><section class="hero"><div class="eyebrow">Прогресс обучения</div><h1 id="name">Ученик</h1><div id="scopeText" class="muted">Подтверждайте модули строго по порядку. После подтверждения текущего модуля следующий откроется ученику автоматически.</div></section><div id="status" class="status">Загрузка...</div><section id="courses" class="courses"></section><div class="footer"><button id="save" class="save" type="button">Сохранить прогресс</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js?v=20260826-1"></script><script>(function(){'use strict';const names=['','Парикмахер с нуля','Женские стрижки','Колористика','Блонд без ошибок','Современные окрашивания','Продвинутый мастер','Колорист-эксперт'];const id=new URLSearchParams(location.search).get('student');const status=document.getElementById('status'),box=document.getElementById('courses'),nameEl=document.getElementById('name'),save=document.getElementById('save'),back=document.getElementById('backLink'),scopeText=document.getElementById('scopeText');let db,role,allowedLevels=new Set();if(!id){status.className='status err';status.textContent='Не выбран ученик.';save.disabled=true;return}if(!window.supabase||!window.JULI_SUPABASE_URL||!window.JULI_SUPABASE_ANON_KEY){status.className='status err';status.textContent='Supabase не настроен.';save.disabled=true;return}db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY);function sync(level){const c=box.querySelector('.course[data-level="'+level+'"]');if(!c||c.classList.contains('locked'))return;const inputs=[...c.querySelectorAll('input[data-module]')];let prev=true;inputs.forEach((input,i)=>{const label=input.closest('.mod');if(i===0||prev){input.disabled=false;label.classList.remove('disabled')}else{input.checked=false;input.disabled=true;label.classList.add('disabled')}label.classList.toggle('current',!input.checked&&!input.disabled&&inputs.slice(0,i).every(x=>x.checked));prev=prev&&input.checked})}function syncAll(){allowedLevels.forEach(l=>sync(l))}async function init(){try{const u=await db.auth.getUser();if(!u.data.user){location.href='login.html';return}const me=await db.from('profiles').select('role').eq('id',u.data.user.id).single();if(me.error||!me.data){location.href='login.html';return}role=me.data.role;if(role==='student'){location.href='student.html';return}if(role==='teacher'){back.href='teacher.html';scopeText.textContent='Доступны только назначенный вам ученик и назначенные вам ступени.';const [tsa,tca]=await Promise.all([db.from('teacher_student_assignments').select('student_id').eq('teacher_id',u.data.user.id).eq('student_id',id).maybeSingle(),db.from('teacher_course_assignments').select('course_level').eq('teacher_id',u.data.user.id)]);if(tsa.error||!tsa.data||tca.error){status.className='status err';status.textContent='Этот ученик вам не назначен.';save.disabled=true;return}allowedLevels=new Set((tca.data||[]).map(x=>Number(x.course_level)))}else if(role==='superteacher'||role==='owner'){back.href='admin.html';allowedLevels=new Set([1,2,3,4,5,6,7])}else{location.href='student.html';return}const [student,access,progress]=await Promise.all([db.from('profiles').select('full_name,email').eq('id',id).single(),db.from('course_access').select('course_level,access_granted').eq('student_id',id),db.from('student_progress').select('course_level,module_no,completed').eq('student_id',id)]);if(student.error||access.error||progress.error)throw student.error||access.error||progress.error;nameEl.textContent=student.data?.full_name||student.data?.email||'Ученик';const allow=new Set((access.data||[]).filter(x=>x.access_granted).map(x=>Number(x.course_level))),done=new Set((progress.data||[]).filter(x=>x.completed).map(x=>Number(x.course_level)+'-'+Number(x.module_no)));const levels=[...allowedLevels].sort((a,b)=>a-b);box.innerHTML=levels.map(level=>{const ok=allow.has(level);return '<article class="course '+(ok?'':'locked')+'" data-level="'+level+'"><div class="course-head"><strong>'+level+'. '+names[level]+'</strong><span>'+(ok?'Доступ открыт':'Ступень ученику не открыта')+'</span></div><div class="mods">'+[1,2,3,4,5,6].map(n=>'<label class="mod"><input type="checkbox" data-level="'+level+'" data-module="'+n+'" '+(done.has(level+'-'+n)?'checked':'')+' '+(ok?'':'disabled')+'> Модуль '+n+'</label>').join('')+'</div>'+(ok?'<div class="note">Следующий модуль станет доступен после сохранения подтверждения текущего.</div>':'Откройте ступень ученику в своём кабинете.')+'</article>'}).join('');syncAll();status.textContent='Готово к редактированию.'}catch(e){console.error(e);status.className='status err';status.textContent='Не удалось загрузить прогресс. Проверьте назначения и актуальный supabase-schema.sql.';save.disabled=true}}box.addEventListener('change',e=>{const input=e.target;if(!input.matches('input[data-level][data-module]'))return;const level=Number(input.dataset.level),n=Number(input.dataset.module);if(!input.checked)box.querySelectorAll('input[data-level="'+level+'"]').forEach(x=>{if(Number(x.dataset.module)>n)x.checked=false});sync(level)});save.addEventListener('click',async()=>{save.disabled=true;status.className='status';status.textContent='Сохраняем...';syncAll();const rows=[],now=new Date().toISOString();for(const level of allowedLevels){const c=box.querySelector('.course[data-level="'+level+'"]');if(!c||c.classList.contains('locked'))continue;for(let n=1;n<=6;n++){const input=c.querySelector('input[data-module="'+n+'"]');rows.push({student_id:id,course_level:level,module_no:n,completed:!!input?.checked,completed_at:input?.checked?now:null})}}if(!rows.length){status.className='status err';status.textContent='Нет открытых ступеней для сохранения.';save.disabled=false;return}const r=await db.from('student_progress').upsert(rows,{onConflict:'student_id,course_level,module_no'});if(r.error){console.error(r.error);status.className='status err';status.textContent='Не удалось сохранить прогресс: недостаточно прав или не применена актуальная схема.';save.disabled=false;return}status.className='status ok';status.textContent='✓ Прогресс сохранён. Следующий модуль открыт ученику.';save.textContent='Сохранено ✓';setTimeout(()=>{save.textContent='Сохранить прогресс';save.disabled=false},1500)});document.getElementById('out').addEventListener('click',async()=>{await db.auth.signOut();location.href='./'});init()})();</script></body></html>
