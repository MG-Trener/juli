<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Заявка принята — JULI</title><style>:root{--gold:#d2a56c;--gold2:#f0d5ad;--text:#f7f3ec;--muted:#aeb5c1;--line:rgba(221,178,121,.24)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0%,rgba(210,165,108,.12),transparent 25%),linear-gradient(180deg,#090e15,#0c121b);font-family:Inter,system-ui,sans-serif;color:var(--text)}.box{width:min(620px,calc(100% - 28px));padding:36px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(24,32,43,.96),rgba(15,21,30,.96));text-align:center}.brand{font:500 32px Georgia,serif;letter-spacing:.08em}.eyebrow{margin-top:24px;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font:500 46px/1 Georgia,serif;margin:10px 0 16px}.user-name{display:inline-block;margin-top:18px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--gold2);font-weight:800}.muted{color:var(--muted);line-height:1.65}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.btn,button{border:1px solid var(--line);border-radius:999px;padding:11px 17px;background:#111923;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.gold{background:linear-gradient(135deg,#e3bb83,#b98343);border:0;color:#101722}</style></head><body><main class="box"><div class="brand">JULI</div><div id="currentUserName" class="user-name">Загрузка...</div><div class="eyebrow">Статус регистрации</div><h1>Вы в списке претендентов</h1><div class="muted">Регистрация завершена. Суперучитель рассмотрит профиль и назначит вам роль. После перевода в Ученики или назначения Учителем соответствующий кабинет откроется автоматически при следующем входе.</div><div class="actions"><a class="btn gold" href="./">На сайт</a><button id="out">Выйти</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js?v=20260826-3"></script><script>(async function(){const db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY);const u=await db.auth.getUser();if(!u.data.user){location.href='login.html';return}const p=await db.from('profiles').select('role,full_name,email').eq('id',u.data.user.id).single();if(p.data?.role==='superteacher'){location.href='admin.html';return}if(p.data?.role==='teacher'){location.href='teacher.html';return}if(p.data?.role==='student'){location.href='student.html';return}document.getElementById('currentUserName').textContent=p.data?.full_name||p.data?.email||u.data.user.email||'Претендент';document.getElementById('out').onclick=async()=>{await db.auth.signOut();location.href='./'}})();</script></body></html>
