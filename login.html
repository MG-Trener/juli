<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Вход — JULI</title><style>:root{--gold:#d5aa73;--gold2:#f0cf9e;--text:#f7f3ed;--muted:#aeb4be;--line:rgba(219,177,119,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#0a0f16;display:grid;grid-template-columns:minmax(0,1fr) 520px}.left{padding:50px 7vw;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(8,12,18,.96),rgba(8,12,18,.55)),image-set(url('assets/hero-model.webp') type('image/webp'),url('assets/hero-model.png') type('image/png')) 72% center/cover no-repeat}.brand{font:500 38px Georgia,serif}.brand small{display:block;font:700 9px Inter,sans-serif;letter-spacing:.14em;color:#d6bea0}.quote h1{font:500 clamp(52px,6vw,88px)/.93 Georgia,serif;margin:12px 0 18px}.quote h1 span{color:var(--gold2);font-style:italic}.quote p{color:#d0d4da;font-size:18px;max-width:570px}.right{padding:36px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(210,165,108,.09),transparent 30%),#0a0f16}.box{width:min(410px,100%);padding:34px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,#1c232d,#11171f)}.userico{width:54px;height:54px;border:1px solid rgba(234,195,140,.44);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:23px;margin:0 auto 18px}.box h2{text-align:center;font-size:22px}.field{display:grid;gap:7px;margin:13px 0}label{font-size:12px;color:#d4d7db}input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.11);border-radius:8px;background:#111720;color:#fff;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:7px;background:linear-gradient(135deg,#e5bd84,#a87741);color:#12171e;font:inherit;font-weight:900;cursor:pointer;margin-top:10px}.links{text-align:center;margin-top:18px;font-size:13px}.links a{display:block;color:#d9c4a6;margin-top:12px;text-decoration:none}.status{margin-top:14px;color:#d7b784;font-size:13px;min-height:20px;line-height:1.4}.status.ok{color:#bde4c5}.status.err{color:#efb1b1}@media(max-width:900px){body{grid-template-columns:1fr}.left{display:none}.right{min-height:100vh;padding:20px;background:linear-gradient(rgba(8,12,18,.86),rgba(8,12,18,.94)),url('assets/hero-model.webp') 70% center/cover no-repeat}}</style></head><body><section class="left"><div class="brand">JULI<small>АКАДЕМИЯ СТРИЖЕК И ОКРАШИВАНИЯ</small></div><div class="quote"><div style="color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800">Личный кабинет</div><h1>Продолжайте путь <span>к мастерству</span></h1><p>После входа система откроет кабинет в соответствии с вашей ролью.</p></div><a href="./" style="color:#c4cad2;text-decoration:none">← Вернуться на сайт</a></section><section class="right"><main class="box"><div class="userico">J</div><h2>Вход в личный кабинет</h2><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" id="submitBtn">Войти</button></form><div id="status" class="status"></div><div class="links"><a href="register.html">Нет аккаунта? Зарегистрироваться</a><a href="./">← На главную</a></div></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js?v=20260826-3"></script><script>(function(){const db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY),f=document.getElementById('f'),st=document.getElementById('status'),btn=document.getElementById('submitBtn');const p=new URLSearchParams(location.search);if(p.get('confirmed')==='1'){st.className='status ok';st.textContent='Email подтверждён. Теперь можно войти.'}function dest(r){return r==='superteacher'?'admin.html':r==='teacher'?'teacher.html':r==='student'?'student.html':'candidate.html'}f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;st.className='status';st.textContent='Входим...';const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim().toLowerCase(),password:document.getElementById('password').value});if(error||!data.user){st.className='status err';const weak=error&&(error.name==='WeakPasswordError'||error.code==='weak_password'||/weak password|password.*weak/i.test(error.message||''));st.textContent=weak?'Этот пароль больше не соответствует действующим требованиям безопасности. Используйте пароль не короче 10 символов с буквами и цифрами либо задайте новый пароль.':'Не удалось войти. Проверьте email и пароль.';btn.disabled=false;return}const r=await db.from('profiles').select('role,is_active,archived').eq('id',data.user.id).single();if(r.error||!r.data){await db.auth.signOut();st.className='status err';st.textContent='Не удалось загрузить профиль.';btn.disabled=false;return}if(!r.data.is_active||r.data.archived){await db.auth.signOut();st.className='status err';st.textContent='Аккаунт заблокирован или удалён.';btn.disabled=false;return}location.href=dest(r.data.role)}})();</script></body></html>
