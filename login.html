<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Вход — JULI</title><style>:root{--bg:#0a0f16;--panel:#141a23;--gold:#d5aa73;--gold2:#f0cf9e;--text:#f7f3ed;--muted:#aeb4be;--line:rgba(219,177,119,.22);--ok:#9ad3a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#0a0f16;display:grid;grid-template-columns:minmax(0,1fr) 520px}.left{position:relative;overflow:hidden;padding:50px 7vw;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(8,12,18,.96) 0%,rgba(8,12,18,.82) 34%,rgba(8,12,18,.28) 72%,rgba(8,12,18,.08) 100%),image-set(url('assets/hero-model.webp') type('image/webp'),url('assets/hero-model.png') type('image/png')) 72% center/cover no-repeat}.left:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,22,.02),rgba(10,15,22,.18) 65%,rgba(10,15,22,.75));pointer-events:none}.left>*{position:relative;z-index:1}.brand{font:500 38px Georgia,serif;letter-spacing:.06em}.brand small{display:block;font:700 9px Inter,sans-serif;letter-spacing:.14em;color:#d6bea0;margin-top:5px}.quote{max-width:600px}.quote h1{font:500 clamp(52px,6vw,88px)/.93 Georgia,serif;margin:12px 0 18px;text-shadow:0 12px 38px rgba(0,0,0,.28)}.quote h1 span{color:var(--gold2);font-style:italic}.quote p{color:#d0d4da;font-size:18px;max-width:570px}.right{padding:36px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(210,165,108,.09),transparent 30%),rgba(10,15,22,.96);border-left:1px solid rgba(255,255,255,.06)}.box{width:min(410px,100%);padding:34px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(28,35,45,.96),rgba(17,23,31,.98));box-shadow:0 26px 70px rgba(0,0,0,.34)}.userico{width:54px;height:54px;border:1px solid rgba(234,195,140,.44);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:23px;margin:0 auto 18px}.box h2{text-align:center;font-size:22px;margin:0 0 24px}.field{display:grid;gap:7px;margin:13px 0}label{font-size:12px;color:#d4d7db}input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.11);border-radius:8px;background:#111720;color:#fff;font:inherit;outline:none}input:focus{border-color:var(--gold)}.btn{width:100%;padding:14px;border:0;border-radius:7px;background:linear-gradient(135deg,#e5bd84,#a87741);color:#12171e;font-weight:900;font:inherit;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.6}.links{text-align:center;margin-top:18px;font-size:13px}.links a{display:block;color:#d9c4a6;margin-top:12px;text-decoration:none}.status{margin-top:14px;color:#d7b784;font-size:13px;min-height:20px;line-height:1.4}.status.ok{padding:12px 14px;border:1px solid rgba(154,211,168,.35);border-radius:12px;background:rgba(68,128,82,.14);color:#bde4c5}.back{color:#c4cad2;font-size:12px;text-decoration:none}@media(max-width:900px){body{grid-template-columns:1fr}.left{display:none}.right{min-height:100vh;border:0;padding:20px;background:linear-gradient(rgba(8,12,18,.86),rgba(8,12,18,.94)),image-set(url('assets/hero-model.webp') type('image/webp'),url('assets/hero-model.png') type('image/png')) 70% center/cover no-repeat}.box{padding:28px;background:rgba(17,23,31,.94);backdrop-filter:blur(18px)}}</style></head><body><section class="left"><div class="brand">JULI<small>АКАДЕМИЯ СТРИЖЕК И ОКРАШИВАНИЯ</small></div><div class="quote"><div style="color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800">Личный кабинет</div><h1>Продолжайте путь <span>к мастерству</span></h1><p>Учебные материалы, доступные ступени и прогресс, который подтверждает преподаватель.</p></div><a class="back" href="./">← Вернуться на сайт</a></section><section class="right"><main class="box"><div class="userico">J</div><h2>Вход в личный кабинет</h2><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="example@mail.kz"></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password" placeholder="Введите пароль"></div><button class="btn" id="submitBtn" type="submit">Войти</button></form><div id="status" class="status"></div><div class="links"><a href="register.html">Нет аккаунта? Зарегистрироваться</a><a href="./">← На главную</a></div></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js"></script><script>(function(){const form=document.getElementById('f');const emailInput=document.getElementById('email');const passwordInput=document.getElementById('password');const statusEl=document.getElementById('status');const submitBtn=document.getElementById('submitBtn');const params=new URLSearchParams(location.search);if(params.get('confirmed')==='1'){statusEl.className='status ok';statusEl.innerHTML='<strong>Email подтверждён.</strong><br>Теперь вы можете войти в личный кабинет.'}if(params.get('blocked')==='1'){statusEl.textContent='Ваш аккаунт заблокирован или неактивен. Обратитесь к преподавателю.'}const configured=!!(window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_')&&window.JULI_SUPABASE_ANON_KEY&&!window.JULI_SUPABASE_ANON_KEY.startsWith('YOUR_'));let db=null;try{if(configured&&window.supabase)db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY)}catch(err){console.error(err)}if(configured&&!db)statusEl.textContent='Не удалось загрузить модуль авторизации. Обновите страницу.';form.addEventListener('submit',async function(e){e.preventDefault();submitBtn.disabled=true;statusEl.className='status';statusEl.textContent='Входим...';const mail=emailInput.value.trim().toLowerCase();const pass=passwordInput.value;try{if(!db){statusEl.textContent='Авторизация временно недоступна. Обновите страницу и попробуйте снова.';return}const {data,error}=await db.auth.signInWithPassword({email:mail,password:pass});if(error){console.warn('Auth sign-in error:',error);const msg=String(error.message||'').toLowerCase();statusEl.textContent=msg.includes('email not confirmed')?'Сначала подтвердите email по ссылке из письма.':'Не удалось войти. Проверьте email и пароль.';return}if(!data?.user){statusEl.textContent='Не удалось войти. Попробуйте ещё раз.';return}const {data:profile,error:profileError}=await db.from('profiles').select('*').eq('id',data.user.id).single();if(profileError||!profile){console.error('Profile lookup error:',profileError);await db.auth.signOut();statusEl.textContent='Не удалось загрузить профиль. Обратитесь к администратору.';return}const hasStatusFields=Object.prototype.hasOwnProperty.call(profile,'is_active')&&Object.prototype.hasOwnProperty.call(profile,'archived');if(profile.role!=='owner'&&hasStatusFields&&(!profile.is_active||profile.archived)){await db.auth.signOut();statusEl.textContent='Ваш аккаунт заблокирован или неактивен. Обратитесь к преподавателю.';return}localStorage.removeItem('juli_teacher_session');location.href=profile.role==='owner'?'admin.html':'student.html'}catch(err){console.error(err);statusEl.textContent='Не удалось выполнить вход. Попробуйте ещё раз.'}finally{submitBtn.disabled=false}})})();</script></body></html>
