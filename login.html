<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Вход — JULI</title><style>:root{--bg:#0a0f16;--panel:#141a23;--gold:#d5aa73;--gold2:#f0cf9e;--text:#f7f3ed;--muted:#aeb4be;--line:rgba(219,177,119,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 25% 28%,rgba(190,122,76,.16),transparent 25%),linear-gradient(rgba(7,11,17,.76),rgba(7,11,17,.9)),url('assets/hero-art.svg') 18% 50%/650px auto no-repeat,#0a0f16;display:grid;grid-template-columns:1fr 520px}.left{padding:50px 7vw;display:flex;flex-direction:column;justify-content:space-between}.brand{font:500 38px Georgia,serif;letter-spacing:.06em}.brand small{display:block;font:700 9px Inter,sans-serif;letter-spacing:.14em;color:var(--muted);margin-top:5px}.quote{max-width:560px}.quote h1{font:500 clamp(48px,6vw,82px)/.98 Georgia,serif;margin:12px 0 18px}.quote h1 span{color:var(--gold2)}.quote p{color:var(--muted);font-size:18px}.right{padding:36px;display:grid;place-items:center;background:rgba(10,15,22,.72);border-left:1px solid rgba(255,255,255,.06);backdrop-filter:blur(16px)}.box{width:min(410px,100%);padding:34px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(28,35,45,.96),rgba(17,23,31,.98));box-shadow:0 26px 70px rgba(0,0,0,.34)}.userico{width:54px;height:54px;border:1px solid rgba(234,195,140,.44);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:23px;margin:0 auto 18px}.box h2{text-align:center;font-size:22px;margin:0 0 24px}.field{display:grid;gap:7px;margin:13px 0}label{font-size:12px;color:#d4d7db}input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.11);border-radius:8px;background:#111720;color:#fff;font:inherit;outline:none}input:focus{border-color:var(--gold)}.btn{width:100%;padding:14px;border:0;border-radius:7px;background:linear-gradient(135deg,#e5bd84,#a87741);color:#12171e;font-weight:900;font:inherit;cursor:pointer;margin-top:10px}.links{text-align:center;margin-top:18px;font-size:13px}.links a{display:block;color:#d9c4a6;margin-top:12px;text-decoration:none}.status{margin-top:14px;color:#d7b784;font-size:13px;min-height:20px;line-height:1.4}.back{color:#9da4ae;font-size:12px;text-decoration:none}@media(max-width:900px){body{grid-template-columns:1fr;background-position:center}.left{display:none}.right{min-height:100vh;border:0;padding:20px}.box{padding:28px}}</style></head><body><section class="left"><div class="brand">JULI<small>АКАДЕМИЯ СТРИЖЕК И ОКРАШИВАНИЯ</small></div><div class="quote"><div style="color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800">Личный кабинет</div><h1>Продолжайте путь <span>к мастерству</span></h1><p>Преподаватель управляет учениками и доступами. Ученики видят только разрешённые курсы.</p></div><a class="back" href="./">← Вернуться на сайт</a></section><section class="right"><main class="box"><div class="userico">♙</div><h2>Вход в личный кабинет</h2><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="example@mail.kz"></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password" placeholder="Введите пароль"></div><button class="btn">Войти</button></form><div id="status" class="status"></div><div class="links"><a href="register.html">Нет аккаунта? Зарегистрироваться</a><a href="./">← На главную</a></div></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const s=document.getElementById('status');const configured=window.JULI_SUPABASE_URL&&!window.JULI_SUPABASE_URL.startsWith('YOUR_')&&window.JULI_SUPABASE_ANON_KEY&&!window.JULI_SUPABASE_ANON_KEY.startsWith('YOUR_');const db=configured?window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY):null;const TEACHER_HASH='2e712779309a5599198b24ef317d1b45fa98a45323ff684fb823fc4854f5b050';async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}if(!configured)s.textContent='Вход преподавателя уже доступен. Регистрация учеников заработает после подключения базы.';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();s.textContent='Входим...';const mail=email.value.trim().toLowerCase();const pass=password.value;const localHash=await sha256(mail+':'+pass);if(localHash===TEACHER_HASH){localStorage.setItem('juli_teacher_session',JSON.stringify({email:mail,ts:Date.now()}));location.href='admin.html';return}if(!db){s.textContent='Неверный email или пароль. Вход учеников пока недоступен без базы.';return}const {data,error}=await db.auth.signInWithPassword({email:mail,password:pass});if(error){s.textContent=error.message;return}const {data:p,error:pe}=await db.from('profiles').select('role').eq('id',data.user.id).single();if(pe){s.textContent='Профиль пользователя не найден.';return}location.href=p.role==='owner'?'admin.html':'student.html';});</script></body></html>
