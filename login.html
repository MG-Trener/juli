<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Julia Hair Education</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:linear-gradient(rgba(248,244,238,.78),rgba(248,244,238,.92)),url('assets/site-bg.webp') center/cover fixed;color:#152037}.box{width:min(430px,calc(100% - 28px));padding:34px;border:1px solid #e7ddd0;border-radius:30px;background:rgba(255,253,249,.92);backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(21,32,55,.12)}h1{font-family:Georgia,serif;font-weight:500;font-size:42px;margin:0 0 10px}.muted{color:#6b7280;margin-bottom:24px}.field{display:grid;gap:7px;margin:14px 0}label{font-size:13px;font-weight:700}input{padding:14px 15px;border:1px solid #ddd3c6;border-radius:14px;font:inherit;background:#fff}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:#152037;color:white;font-weight:800;font:inherit;cursor:pointer;margin-top:8px}.link{display:block;text-align:center;margin-top:18px;color:#7b6548;text-decoration:none}.status{margin-top:14px;font-size:14px;min-height:22px}</style></head><body><main class="box"><div style="font-size:12px;font-weight:800;letter-spacing:.1em;color:#b7894c">JULIA HAIR EDUCATION</div><h1>Личный кабинет</h1><div class="muted">Войдите по email и паролю, которые были выданы после записи на курс.</div><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Войти</button></form><div id="status" class="status"></div><a class="link" href="./">← Вернуться на сайт</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const s=document.getElementById('status');if(window.JULI_SUPABASE_URL?.startsWith('YOUR_'))s.textContent='Авторизация будет активна после подключения базы Supabase.';const db=window.supabase?.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY);document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();s.textContent='Входим...';if(!db){s.textContent='Supabase пока не настроен.';return}const {data,error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){s.textContent=error.message;return}const {data:p,error:pe}=await db.from('profiles').select('role,course_level').eq('id',data.user.id).single();if(pe){s.textContent='Профиль пользователя не найден.';return}location.href=p.role==='owner'?'admin.html':'student.html';});</script></body></html>
