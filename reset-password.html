<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Новый пароль — JULI</title><style>:root{--gold:#d5aa73;--gold2:#f0cf9e;--text:#f7f3ed;--muted:#aeb4be;--line:rgba(219,177,119,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0%,rgba(210,165,108,.1),transparent 28%),#0a0f16}.box{width:min(460px,100%);padding:34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#1c232d,#11171f)}.brand{font:500 34px Georgia,serif}.brand small{display:block;font:700 9px Inter,sans-serif;letter-spacing:.14em;color:#d6bea0}h1{font:500 38px/1 Georgia,serif;margin:28px 0 10px}.muted{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:16px 0}label{font-size:12px;color:#d4d7db}input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.11);border-radius:10px;background:#111720;color:#fff;font:inherit}.hint{font-size:12px;color:#9fa6b0;line-height:1.45}.btn{width:100%;padding:14px;border:0;border-radius:9px;background:linear-gradient(135deg,#e5bd84,#a87741);color:#12171e;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.status{margin-top:16px;min-height:22px;font-size:13px;line-height:1.45;color:#d7b784}.status.ok{color:#bde4c5}.status.err{color:#efb1b1}.links{text-align:center;margin-top:22px}.links a{display:block;margin-top:10px;color:#d9c4a6;text-decoration:none}</style></head><body><main class="box"><div class="brand">JULI<small>HAIR EDUCATION</small></div><h1>Новый пароль</h1><p class="muted">Задайте новый пароль для аккаунта JULI.</p><form id="f"><div class="field"><label>Новый пароль</label><input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><div class="hint">Минимум 12 символов: строчная и заглавная буква, цифра и специальный символ.</div></div><div class="field"><label>Повторите пароль</label><input id="password2" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></div><button class="btn" id="submitBtn">Сохранить новый пароль</button></form><div id="status" class="status">Проверяем ссылку восстановления...</div><div class="links"><a href="login.html">← Вернуться ко входу</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js?v=20260826-3"></script><script>(function(){const db=window.supabase.createClient(window.JULI_SUPABASE_URL,window.JULI_SUPABASE_ANON_KEY),f=document.getElementById('f'),pw=document.getElementById('password'),pw2=document.getElementById('password2'),btn=document.getElementById('submitBtn'),st=document.getElementById('status');let ready=false;const strong=v=>v.length>=12&&/[a-zа-яёәғқңөұүһі]/.test(v)&&/[A-ZА-ЯЁӘҒҚҢӨҰҮҺІ]/.test(v)&&/\d/.test(v)&&/[^A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІ0-9\s]/.test(v);function setReady(){ready=true;st.className='status ok';st.textContent='Ссылка подтверждена. Введите новый пароль.'}db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)setReady()});db.auth.getSession().then(({data})=>{if(data.session){setReady()}else{setTimeout(()=>{if(!ready){st.className='status err';st.textContent='Ссылка недействительна или истекла. Запросите восстановление пароля ещё раз.';btn.disabled=true}},1200)}});f.onsubmit=async e=>{e.preventDefault();if(!ready)return;if(!strong(pw.value)){st.className='status err';st.textContent='Пароль должен содержать минимум 12 символов, строчную и заглавную букву, цифру и специальный символ.';return}if(pw.value!==pw2.value){st.className='status err';st.textContent='Пароли не совпадают.';return}btn.disabled=true;st.className='status';st.textContent='Сохраняем новый пароль...';const {error}=await db.auth.updateUser({password:pw.value});if(error){st.className='status err';st.textContent='Не удалось изменить пароль. Запросите новую ссылку восстановления.';btn.disabled=false;return}await db.auth.signOut();location.href='login.html?reset=1'};})();</script></body></html>
